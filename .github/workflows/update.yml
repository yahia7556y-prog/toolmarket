name: update
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collector/discover.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: python collector/collect.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", TELEMETRY_URL: "${{ vars.TELEMETRY_URL }}"}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A data web collector; git commit -m "daily update" || true; git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: web}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
