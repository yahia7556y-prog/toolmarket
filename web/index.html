<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوق الأدوات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f2;--surf:#fff;--ink:#14201b;--mut:#66736c;--line:#dde3de;--up:#0a8a55;--dn:#cf3b3b;--acc:#0f6b4f;--accink:#fff;--chip:#e8ede9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1210;--surf:#141c19;--ink:#e6eee9;--mut:#8b9a92;--line:#25312c;--up:#2fd18a;--dn:#ff6b6b;--acc:#2fd18a;--accink:#06140e;--chip:#1d2823;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1210;--surf:#141c19;--ink:#e6eee9;--mut:#8b9a92;--line:#25312c;--up:#2fd18a;--dn:#ff6b6b;--acc:#2fd18a;--accink:#06140e;--chip:#1d2823;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:14px}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mut);margin:0 0 10px;font-size:13px}
.tick{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tk{flex:0 0 auto;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:140px}
.tk small{color:var(--mut);display:block;font-size:11px}
.tk b{font-size:15px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tabs{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:8px}
.tabs button,select,input{font:inherit;color:var(--ink)}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--surf);font-weight:700;box-shadow:0 0 0 1px var(--line)}
input,select{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input{flex:1;min-width:140px}
.tw{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;cursor:pointer;user-select:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--chip)}
.n{font-weight:700}
.d{color:var(--mut);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ty{font-size:11px;background:var(--chip);border-radius:20px;padding:2px 8px}
.up{color:var(--up)}.dn{color:var(--dn)}
.num{font-variant-numeric:tabular-nums}
.ins{background:var(--acc);color:var(--accink);border:0;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;font-size:12px}
.pn{position:fixed;inset:auto 0 0 0;background:var(--surf);border-top:1px solid var(--line);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
.pn.show{display:block}
.pn code{display:block;direction:ltr;text-align:left;background:var(--chip);padding:8px;border-radius:6px;margin:8px 0;overflow-x:auto}
.note{color:var(--mut);font-size:12px;margin:10px 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<h1>سوق الأدوات والمهارات</h1>
<p class="sub">الأكثر استخداماً اليوم في شاشة واحدة. <span id="upd"></span></p>
<div class="tick" id="tick"></div>
<div class="bar">
<div class="tabs" id="tabs"></div>
<input id="q" placeholder="ابحث عن أداة أو مهارة" aria-label="بحث">
<select id="dom" aria-label="المجال"><option value="">كل المجالات</option></select>
</div>
<div class="tw"><table>
<thead><tr><th>#</th><th data-k="name">الاسم</th><th>النوع</th><th data-k="score">التقييم</th><th data-k="use">الاستخدام اليومي</th><th data-k="chg">التغير 24س</th><th>آخر 7 أيام</th><th></th></tr></thead>
<tbody id="rows"></tbody></table></div>
<p class="note">الترتيب الافتراضي حسب الاستخدام. اضغط على عنوان العمود لإعادة الترتيب.</p>
</div>
<div class="pn" id="pn"><b id="pt"></b><div class="d" id="pd" style="max-width:none"></div><code id="pc"></code><button class="ins" id="cp">نسخ أمر التثبيت</button> <button class="ins" style="background:var(--chip);color:var(--ink)" onclick="pn.classList.remove('show')">إغلاق</button></div>
<script>
var D=[];
var cur="",TELEMETRY="";
var tab="الكل",sk="use",asc=false,$=function(i){return document.getElementById(i)};
["الكل","أداة","مهارة","وكيل"].forEach(function(t){var b=document.createElement("button");b.textContent=t=="الكل"?"الكل":t=="أداة"?"أدوات":t=="مهارة"?"مهارات":"وكلاء";b.onclick=function(){tab=t;render()};b.dataset.t=t;$("tabs").appendChild(b)});
function fmt(n){return n.toLocaleString("en-US")}
function spark(a,up){var mn=Math.min.apply(0,a),mx=Math.max.apply(0,a),w=80,h=24;var p=a.map(function(v,i){return (i*w/6).toFixed(1)+","+(h-(v-mn)/(mx-mn||1)*(h-4)-2).toFixed(1)}).join(" ");return '<svg width="80" height="24" viewBox="0 0 80 24"><polyline fill="none" stroke="'+(up?'var(--up)':'var(--dn)')+'" stroke-width="1.6" points="'+p+'"/></svg>'}
function ticker(){var top=D.slice().sort(function(a,b){return b.use-a.use})[0],rise=D.slice().sort(function(a,b){return b.chg-a.chg})[0],fall=D.slice().sort(function(a,b){return a.chg-b.chg})[0];
$("tick").innerHTML=[["الأكثر استخداماً",top.name,fmt(top.use)],["الأسرع صعوداً",rise.name,"+"+rise.chg+"%"],["الأكثر هبوطاً",fall.name,fall.chg+"%"],["عدد العناصر",D.length,"تحديث يومي"]].map(function(x){return '<div class="tk"><small>'+x[0]+'</small><b>'+x[1]+'</b> <small>'+x[2]+'</small></div>'}).join("")}
function render(){
document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.t==tab?"on":""});
var q=$("q").value.toLowerCase(),m=$("dom").value;
var L=D.filter(function(d){return (tab=="الكل"||d.type==tab)&&(!m||d.dom==m)&&(d.name+d.desc).toLowerCase().indexOf(q)>-1});
L.sort(function(a,b){var x=a[sk],y=b[sk];var r=x>y?1:x<y?-1:0;return asc?r:-r});
$("rows").innerHTML=L.length?L.map(function(d,i){var up=d.chg>=0;return '<tr data-n="'+d.name+'"><td class="num">'+(i+1)+'</td><td><div class="n">'+d.name+'</div><div class="d">'+d.desc+'</div></td><td><span class="ty">'+d.type+'</span></td><td class="num">★ '+d.score.toFixed(1)+'</td><td class="num">'+fmt(d.use)+'</td><td class="num '+(up?'up':'dn')+'">'+(up?'▲ +':'▼ ')+d.chg.toFixed(1)+'%</td><td>'+spark(d.sp,up)+'</td><td><button class="ins" data-i="'+d.name+'">تثبيت</button></td></tr>'}).join(""):'<tr><td colspan="8">لا توجد نتائج. جرّب كلمة أخرى أو اختر كل المجالات.</td></tr>'}
document.querySelectorAll("th[data-k]").forEach(function(h){h.onclick=function(){var k=h.dataset.k;if(sk==k)asc=!asc;else{sk=k;asc=k=="name"}render()}});
$("q").oninput=render;$("dom").onchange=render;
$("rows").onclick=function(e){var t=e.target.closest("tr");if(!t)return;var d=D.filter(function(x){return x.name==t.dataset.n})[0];cur=d.name;$("pt").textContent=d.name;$("pd").textContent=d.desc+(d.inst?" — "+d.inst+" تثبيت عبر السوق":"");$("pc").textContent=d.cmd;$("cp").textContent="نسخ أمر التثبيت";$("pn").classList.add("show")};
$("cp").onclick=function(){var t=$("pc").textContent;try{navigator.clipboard.writeText(t)}catch(e){}if(TELEMETRY&&cur)try{fetch(TELEMETRY+"/install",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:cur}),keepalive:true})}catch(e){}$("cp").textContent="تم النسخ"};
fetch("data.json").then(function(r){return r.json()}).then(function(j){D=j.items;TELEMETRY=j.telemetry||"";$("upd").textContent="آخر تحديث: "+j.updated+(j.demo?" (بيانات تجريبية)":"");D.map(function(d){return d.dom}).filter(function(v,i,a){return a.indexOf(v)==i}).forEach(function(m){var o=document.createElement("option");o.value=o.textContent=m;$("dom").appendChild(o)});ticker();render()}).catch(function(){$("upd").textContent="تعذر تحميل data.json"});
</script>
</body>
</html>
